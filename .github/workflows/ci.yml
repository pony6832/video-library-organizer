name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[test]" ruff
      - name: Lint
        run: python -m ruff check src tests scripts packaging
      - name: Test
        # Live Gemini tests need a real key and are excluded from CI.
        run: python -m pytest -q --ignore=tests/integration
