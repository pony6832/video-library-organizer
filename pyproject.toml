[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-library-organizer"
version = "0.3.0b3"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<4", "Pillow>=10,<12"]

[project.scripts]
media-catalog = "media_catalog.cli:main"

[tool.setuptools.package-data]
media_catalog = ["assets/*.ico"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "PyYAML>=6,<7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Start with correctness rules (syntax errors, undefined names, unused
# imports/variables); widen once the existing style is normalized.
select = ["E9", "F"]
